name: ${COMPOSE_PROJECT_NAME:-prostor_magento_test}

services:
  app:
    build:
      context: ./docker/php
      args:
        APP_UID: 1000
        APP_GID: 1000
    image: prostor-magento-app:2.4.9-php8.5
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ../.secrets/composer-auth.json:/tmp/composer/auth.json:ro
    environment:
      COMPOSER_HOME: /tmp/composer
      PROSTOR_CUMDISCOUNT_LOCAL_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      valkey:
        condition: service_healthy
      loyalty-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "127.0.0.1:${MAGENTO_HOST_PORT:-18090}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11-oraclelinux9
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --max-allowed-packet=64M --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-loyalty:
    image: redis:8.2.9-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  loyalty-mock:
    image: prostor-magento-app:2.4.9-php8.5
    command: ["sh", "-c", "php -d log_errors=0 -S 0.0.0.0:8080 /app/server.php >/dev/null 2>&1"]
    volumes:
      - ./docker/loyalty-mock/server.php:/app/server.php:ro
    environment:
      LOYALTY_MOCK_MODE: ${LOYALTY_MOCK_MODE:-normal}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === 'ok' ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  mysql-data:
  opensearch-data:
  valkey-data:
